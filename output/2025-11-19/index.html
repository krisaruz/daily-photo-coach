<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日摄影教练 · 2025-11-19</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: {
                        display: ['"Cormorant Garamond"', '"Noto Serif SC"', 'serif'],
                        serif: ['"Noto Serif SC"', '"Source Han Serif SC"', 'serif'],
                        sans: ['Manrope', '"Noto Sans SC"', 'sans-serif']
                    }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@500;600;700&family=Manrope:wght@400;500;600;700;800&family=Noto+Sans+SC:wght@400;500;700&family=Noto+Serif+SC:wght@500;700;900&display=swap" rel="stylesheet">
    <style>
        :root {
            --paper: #f5eee4;
            --paper-soft: #fbf8f2;
            --paper-strong: #fffdfa;
            --ink: #201913;
            --muted: #6f655c;
            --line: rgba(55, 42, 32, 0.14);
            --shadow: 0 22px 54px rgba(70, 53, 38, 0.08);
            --shadow-soft: 0 10px 28px rgba(70, 53, 38, 0.06);
        }

        * { box-sizing: border-box; }

        body {
            margin: 0;
            font-family: 'Manrope', 'Noto Sans SC', sans-serif;
            color: var(--ink);
            background:
                linear-gradient(180deg, rgba(255, 255, 255, 0.58), rgba(255, 255, 255, 0) 200px) 0 0 / 100% 200px no-repeat,
                linear-gradient(145deg, #eee5d8 0%, #f8f1e7 48%, #f3ece2 100%);
            -webkit-font-smoothing: antialiased;
        }

        body::before {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -2;
            background-image:
                linear-gradient(rgba(52, 40, 30, 0.03) 1px, transparent 1px),
                linear-gradient(90deg, rgba(52, 40, 30, 0.03) 1px, transparent 1px);
            background-size: 28px 28px;
            opacity: 0.35;
            pointer-events: none;
        }

        body::after {
            content: '';
            position: fixed;
            inset: 0;
            z-index: -1;
            pointer-events: none;
            background:
                radial-gradient(circle at top, rgba(255, 255, 255, 0.48), transparent 26%),
                linear-gradient(180deg, rgba(255, 255, 255, 0.22), transparent 32%);
        }

        .page-shell {
            width: min(1360px, calc(100vw - 32px));
            margin: 0 auto;
            padding-bottom: 48px;
        }

        .topbar {
            position: sticky;
            top: 0;
            z-index: 40;
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 18px;
            padding: 14px 18px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: rgba(255, 253, 249, 0.72);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-soft);
        }

        .topbar a {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            color: rgba(32, 25, 19, 0.72);
            text-decoration: none;
            font-size: 13px;
            font-weight: 700;
        }

        .topbar-brand {
            text-align: center;
        }

        .topbar-brand strong {
            display: block;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: 32px;
            font-weight: 600;
            line-height: 0.92;
        }

        .topbar-brand span,
        .topbar-meta {
            font-size: 12px;
            color: rgba(32, 25, 19, 0.52);
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .day-hero {
            position: relative;
            display: grid;
            grid-template-columns: minmax(0, 1.08fr) minmax(360px, 0.92fr);
            gap: 20px;
            margin-top: 18px;
            padding: 18px;
            border-radius: 34px;
            border: 1px solid var(--line);
            background: rgba(255, 253, 249, 0.78);
            box-shadow: var(--shadow);
        }

        .day-hero-media {
            position: relative;
            min-height: 460px;
            border-radius: 26px;
            overflow: hidden;
            background: #1f1a17;
        }

        .day-hero-media img {
            width: 100%;
            height: 100%;
            object-fit: cover;
        }

        .day-hero-media::after {
            content: '';
            position: absolute;
            inset: 0;
            background:
                linear-gradient(180deg, rgba(21, 17, 13, 0.04), rgba(21, 17, 13, 0.68)),
                linear-gradient(135deg, rgba(255, 255, 255, 0), rgba(21, 17, 13, 0.18));
        }

        .hero-credit {
            position: absolute;
            left: 18px;
            bottom: 18px;
            z-index: 1;
            display: flex;
            flex-wrap: wrap;
            gap: 10px;
        }

        .hero-credit span {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 9px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.12);
            color: rgba(255, 255, 255, 0.9);
            font-size: 12px;
            font-weight: 700;
        }

        .day-hero-copy {
            display: flex;
            flex-direction: column;
            justify-content: space-between;
            padding: 18px 12px 18px 6px;
        }

        .eyebrow {
            margin: 0 0 14px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.18em;
            text-transform: uppercase;
            color: rgba(32, 25, 19, 0.48);
        }

        .day-title {
            margin: 0;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: clamp(50px, 7vw, 82px);
            line-height: 0.94;
            font-weight: 600;
        }

        .day-summary {
            margin: 20px 0 0;
            font-size: 16px;
            line-height: 1.9;
            color: rgba(32, 25, 19, 0.74);
            max-width: 540px;
        }

        .hero-stats {
            display: grid;
            grid-template-columns: repeat(3, minmax(0, 1fr));
            gap: 12px;
            margin-top: 28px;
        }

        .hero-stat {
            padding: 14px 16px;
            border-radius: 20px;
            border: 1px solid rgba(55, 42, 32, 0.12);
            background: rgba(255, 255, 255, 0.46);
        }

        .hero-stat strong {
            display: block;
            font-size: clamp(22px, 3vw, 32px);
            font-weight: 800;
            line-height: 1;
        }

        .hero-stat span {
            display: block;
            margin-top: 8px;
            font-size: 12px;
            color: var(--muted);
        }

        .hero-highlight {
            margin-top: 24px;
            padding: 18px 20px;
            border-radius: 22px;
            border: 1px solid rgba(55, 42, 32, 0.12);
            background: rgba(255, 255, 255, 0.56);
        }

        .hero-highlight strong {
            display: block;
            margin-bottom: 8px;
            font-size: 12px;
            letter-spacing: 0.16em;
            text-transform: uppercase;
            color: rgba(32, 25, 19, 0.52);
        }

        .hero-highlight p {
            margin: 0;
            font-size: 14px;
            line-height: 1.85;
            color: rgba(32, 25, 19, 0.78);
        }

        .tab-shell {
            position: sticky;
            top: 82px;
            z-index: 35;
            margin-top: 18px;
            padding: 10px;
            border-radius: 22px;
            border: 1px solid var(--line);
            background: rgba(255, 253, 249, 0.74);
            backdrop-filter: blur(16px);
            box-shadow: var(--shadow-soft);
        }

        .tab-row {
            display: flex;
            gap: 10px;
            overflow-x: auto;
            scrollbar-width: none;
        }

        .tab-row::-webkit-scrollbar { display: none; }

        .tab-pill {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 16px;
            border-radius: 18px;
            border: 1px solid rgba(55, 42, 32, 0.1);
            background: rgba(255, 255, 255, 0.48);
            color: rgba(32, 25, 19, 0.64);
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.22s ease, border-color 0.22s ease, background 0.22s ease, color 0.22s ease;
            white-space: nowrap;
        }

        .tab-pill:hover {
            transform: translateY(-1px);
            border-color: color-mix(in srgb, var(--tab-accent) 28%, rgba(55, 42, 32, 0.16));
        }

        .tab-pill.active {
            color: var(--ink);
            border-color: color-mix(in srgb, var(--tab-accent) 34%, rgba(55, 42, 32, 0.16));
            background: color-mix(in srgb, var(--tab-accent) 12%, rgba(255, 255, 255, 0.64));
            box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--tab-accent) 14%, transparent);
        }

        .tab-pill-count {
            display: inline-flex;
            align-items: center;
            justify-content: center;
            min-width: 24px;
            height: 24px;
            padding: 0 8px;
            border-radius: 999px;
            background: rgba(255, 255, 255, 0.72);
            color: var(--ink);
            font-size: 11px;
            font-weight: 800;
        }

        .panel {
            display: none;
        }

        .panel.active {
            display: block;
            animation: fadeUp 0.35s ease;
        }

        @keyframes fadeUp {
            from { opacity: 0; transform: translateY(10px); }
            to { opacity: 1; transform: translateY(0); }
        }

        .panel-wrap {
            margin-top: 26px;
        }

        .style-header {
            display: flex;
            align-items: end;
            justify-content: space-between;
            gap: 20px;
            padding: 0 4px 10px;
        }

        .style-kicker {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 8px 12px;
            border-radius: 999px;
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(32, 25, 19, 0.6);
            background: rgba(255, 255, 255, 0.46);
            border: 1px solid rgba(55, 42, 32, 0.1);
        }

        .style-title {
            margin: 18px 0 10px;
            font-family: 'Cormorant Garamond', 'Noto Serif SC', serif;
            font-size: clamp(34px, 5vw, 52px);
            line-height: 0.96;
            font-weight: 600;
        }

        .style-summary {
            margin: 0;
            max-width: 620px;
            font-size: 15px;
            line-height: 1.85;
            color: rgba(32, 25, 19, 0.74);
        }

        .style-actions {
            display: flex;
            flex-direction: column;
            align-items: end;
            gap: 12px;
        }

        .style-count {
            font-size: 13px;
            font-weight: 800;
            letter-spacing: 0.1em;
            text-transform: uppercase;
            color: rgba(32, 25, 19, 0.48);
        }

        .refresh-btn {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 11px 14px;
            border-radius: 16px;
            border: 1px solid rgba(55, 42, 32, 0.12);
            background: rgba(255, 255, 255, 0.52);
            color: rgba(32, 25, 19, 0.72);
            font-size: 13px;
            font-weight: 700;
            transition: transform 0.2s ease, border-color 0.2s ease, background 0.2s ease;
        }

        .refresh-btn:hover {
            transform: translateY(-1px);
            background: rgba(255, 255, 255, 0.72);
        }

        .photo-stack {
            display: grid;
            gap: 24px;
            margin-top: 18px;
        }

        .photo-card {
            display: grid;
            grid-template-columns: minmax(0, 1.05fr) minmax(360px, 0.95fr);
            gap: 18px;
            padding: 18px;
            border-radius: 28px;
            border: 1px solid var(--line);
            background: rgba(255, 253, 249, 0.76);
            box-shadow: var(--shadow-soft);
        }

        .photo-stage {
            position: relative;
            width: 100%;
            overflow: hidden;
            border: none;
            border-radius: 22px;
            padding: 0;
            cursor: zoom-in;
            background: #1f1a17;
        }

        .photo-stage.landscape { aspect-ratio: 16 / 10; }
        .photo-stage.portrait { aspect-ratio: 4 / 5; }
        .photo-stage.square { aspect-ratio: 1 / 1; }
        .photo-stage.unknown { aspect-ratio: 16 / 10; }

        .photo-stage img {
            width: 100%;
            height: 100%;
            object-fit: cover;
            transition: transform 0.45s ease;
        }

        .photo-stage:hover img {
            transform: scale(1.03);
        }

        .photo-stage::after {
            content: '';
            position: absolute;
            inset: 0;
            background: linear-gradient(180deg, rgba(21, 17, 13, 0), rgba(21, 17, 13, 0.78));
            opacity: 0.95;
        }

        .photo-stage-info {
            position: absolute;
            left: 18px;
            right: 18px;
            bottom: 18px;
            z-index: 1;
            color: white;
        }

        .photo-stage-index {
            display: inline-flex;
            align-items: center;
            gap: 8px;
            padding: 8px 12px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.16);
            background: rgba(255, 255, 255, 0.12);
            font-size: 12px;
            font-weight: 800;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .photo-stage-info p {
            margin: 10px 0 0;
            font-size: 15px;
            line-height: 1.6;
            color: rgba(255, 255, 255, 0.88);
        }

        .photo-panel {
            display: flex;
            flex-direction: column;
            gap: 16px;
            min-width: 0;
        }

        .meta-strip {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            flex-wrap: wrap;
            padding-bottom: 12px;
            border-bottom: 1px solid rgba(55, 42, 32, 0.1);
        }

        .meta-strip a {
            color: var(--ink);
            text-decoration: none;
            font-weight: 700;
        }

        .meta-strip a:hover {
            text-decoration: underline;
        }

        .meta-label {
            margin-bottom: 4px;
            font-size: 11px;
            letter-spacing: 0.14em;
            text-transform: uppercase;
            color: rgba(32, 25, 19, 0.48);
            font-weight: 800;
        }

        .meta-value {
            font-size: 14px;
            line-height: 1.7;
            color: rgba(32, 25, 19, 0.78);
        }

        .meta-links {
            display: flex;
            align-items: center;
            flex-wrap: wrap;
            gap: 8px;
            font-size: 14px;
            color: rgba(32, 25, 19, 0.68);
        }

        .meta-links span {
            color: rgba(32, 25, 19, 0.34);
        }

        .frame-note {
            padding: 16px 18px;
            border-radius: 20px;
            border: 1px solid rgba(55, 42, 32, 0.12);
            background: rgba(255, 255, 255, 0.56);
        }

        .frame-note p {
            margin: 0;
            font-size: 14px;
            line-height: 1.82;
            color: rgba(32, 25, 19, 0.82);
        }

        .spec-grid {
            display: grid;
            grid-template-columns: repeat(2, minmax(0, 1fr));
            gap: 10px;
        }

        .spec-card {
            min-height: 80px;
            padding: 14px;
            border-radius: 18px;
            border: 1px solid rgba(55, 42, 32, 0.12);
            background: rgba(255, 255, 255, 0.5);
        }

        .spec-card span {
            display: block;
            margin-bottom: 8px;
            font-size: 11px;
            letter-spacing: 0.12em;
            text-transform: uppercase;
            color: rgba(32, 25, 19, 0.46);
            font-weight: 800;
        }

        .spec-card strong {
            display: block;
            font-size: 14px;
            line-height: 1.6;
            color: rgba(32, 25, 19, 0.82);
            word-break: break-word;
        }

        .analysis-wrap {
            padding-top: 6px;
            border-top: 1px solid rgba(55, 42, 32, 0.1);
        }

        .expand-btn {
            display: inline-flex;
            align-items: center;
            gap: 10px;
            padding: 12px 0;
            border: none;
            background: transparent;
            color: rgba(32, 25, 19, 0.76);
            font-size: 14px;
            font-weight: 700;
            cursor: pointer;
        }

        .expand-btn .chevron {
            transition: transform 0.24s ease;
        }

        .expand-btn.open .chevron {
            transform: rotate(180deg);
        }

        .analysis-body {
            display: none;
            margin-top: 8px;
            padding: 18px 20px;
            border-radius: 22px;
            border: 1px solid rgba(55, 42, 32, 0.1);
            background: rgba(255, 255, 255, 0.62);
        }

        .analysis-body.open {
            display: block;
            animation: fadeUp 0.3s ease;
        }

        .analysis h2 {
            margin: 0 0 12px;
            padding-bottom: 10px;
            border-bottom: 1px solid rgba(55, 42, 32, 0.1);
            font-family: 'Noto Serif SC', serif;
            font-size: 1.08rem;
            font-weight: 800;
            color: var(--ink);
        }

        .analysis h2:not(:first-child) {
            margin-top: 24px;
        }

        .analysis p,
        .analysis li {
            margin: 0;
            font-size: 14px;
            line-height: 1.92;
            color: rgba(32, 25, 19, 0.8);
        }

        .analysis p + p,
        .analysis p + ul,
        .analysis ul + p,
        .analysis li + li {
            margin-top: 10px;
        }

        .analysis ul,
        .analysis ol {
            margin: 12px 0 0;
            padding-left: 1.2rem;
        }

        .analysis strong {
            color: var(--ink);
            font-weight: 800;
        }

        .analysis code {
            padding: 0.14em 0.42em;
            border-radius: 6px;
            background: rgba(55, 42, 32, 0.08);
            font-size: 0.9em;
        }

        .analysis hr {
            border: none;
            border-top: 1px solid rgba(55, 42, 32, 0.1);
            margin: 18px 0;
        }

        footer {
            padding: 34px 6px 10px;
            text-align: center;
            color: rgba(32, 25, 19, 0.48);
            font-size: 12px;
            letter-spacing: 0.08em;
            text-transform: uppercase;
        }

        .lightbox {
            position: fixed;
            inset: 0;
            z-index: 100;
            display: none;
            align-items: center;
            justify-content: center;
            padding: 28px;
            background: rgba(16, 12, 10, 0.94);
        }

        .lightbox.open {
            display: flex;
            animation: fadeUp 0.24s ease;
        }

        .lightbox-inner {
            max-width: min(1200px, 100%);
            width: fit-content;
        }

        .lightbox img {
            display: block;
            max-width: min(92vw, 1200px);
            max-height: 82vh;
            border-radius: 18px;
            object-fit: contain;
        }

        .lightbox-caption {
            display: flex;
            align-items: center;
            justify-content: space-between;
            gap: 16px;
            margin-top: 14px;
            color: rgba(255, 255, 255, 0.84);
            font-size: 13px;
        }

        .lightbox-caption strong {
            display: block;
            font-size: 14px;
            color: white;
        }

        .lightbox-close {
            position: absolute;
            top: 22px;
            right: 22px;
            display: inline-flex;
            align-items: center;
            justify-content: center;
            width: 44px;
            height: 44px;
            border-radius: 999px;
            border: 1px solid rgba(255, 255, 255, 0.12);
            background: rgba(255, 255, 255, 0.08);
            color: white;
            cursor: pointer;
        }

        @media (max-width: 1120px) {
            .day-hero,
            .photo-card {
                grid-template-columns: 1fr;
            }

            .day-hero-copy {
                padding: 10px 4px 6px;
            }
        }

        @media (max-width: 780px) {
            .page-shell {
                width: min(100vw - 20px, 1360px);
            }

            .topbar {
                padding: 12px 14px;
                border-radius: 18px;
            }

            .topbar-brand strong {
                font-size: 24px;
            }

            .day-hero {
                padding: 14px;
                border-radius: 24px;
            }

            .day-hero-media {
                min-height: 320px;
                border-radius: 18px;
            }

            .hero-stats,
            .spec-grid {
                grid-template-columns: 1fr;
            }

            .tab-shell {
                top: 76px;
                border-radius: 18px;
            }

            .style-header {
                flex-direction: column;
                align-items: start;
            }

            .style-actions {
                width: 100%;
                align-items: start;
            }

            .photo-card {
                padding: 14px;
                border-radius: 22px;
            }

            .photo-stage,
            .photo-stage.landscape,
            .photo-stage.portrait,
            .photo-stage.square,
            .photo-stage.unknown {
                aspect-ratio: 4 / 3;
                border-radius: 18px;
            }

            .analysis-body {
                padding: 16px;
                border-radius: 18px;
            }
        }
    </style>
</head>
<body>
    <div class="page-shell">
        <header class="topbar">
            <a href="../index.html">
                <svg class="w-4 h-4" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24" aria-hidden="true">
                    <path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"></path>
                </svg>
                回到档案首页
            </a>
            <div class="topbar-brand">
                <strong>Daily Photo Coach</strong>
                <span>2025-11-19</span>
            </div>
            <div class="topbar-meta">0 photos · 0 styles</div>
        </header>

        

        <nav class="tab-shell">
            <div class="tab-row" id="tab-bar">
                
            </div>
        </nav>

        <main class="panel-wrap">
            
        </main>

        <footer>Daily Photo Coach · Learn by looking closely</footer>
    </div>

    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <button class="lightbox-close" type="button" onclick="closeLightbox(event)" aria-label="Close image preview">
            <svg class="w-6 h-6" fill="none" stroke="currentColor" stroke-width="1.8" viewBox="0 0 24 24" aria-hidden="true">
                <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"></path>
            </svg>
        </button>
        <div class="lightbox-inner">
            <img id="lightbox-image" src="" alt="">
            <div class="lightbox-caption">
                <div>
                    <strong id="lightbox-caption-title"></strong>
                    <span id="lightbox-caption-photographer"></span>
                </div>
            </div>
        </div>
    </div>

    <script>
        function switchTab(slug) {
            document.querySelectorAll('.tab-pill').forEach(button => button.classList.remove('active'));
            document.querySelectorAll('.panel').forEach(panel => panel.classList.remove('active'));

            const targetButton = document.querySelector(`.tab-pill[data-tab="${slug}"]`);
            const targetPanel = document.getElementById(`panel-${slug}`);
            if (!targetButton || !targetPanel) return;

            targetButton.classList.add('active');
            targetPanel.classList.add('active');
            window.history.replaceState({}, '', `${window.location.pathname}#${encodeURIComponent(slug)}`);
            window.scrollTo({ top: 0, behavior: 'smooth' });
        }

        function toggleAnalysis(button) {
            const body = button.nextElementSibling;
            const isOpen = body.classList.contains('open');

            body.classList.toggle('open', !isOpen);
            button.classList.toggle('open', !isOpen);
            button.querySelector('.label').textContent = isOpen ? '展开完整分析' : '收起完整分析';
        }

        function openLightbox(trigger) {
            const lightbox = document.getElementById('lightbox');
            document.getElementById('lightbox-image').src = trigger.dataset.full;
            document.getElementById('lightbox-caption-title').textContent = trigger.dataset.caption;
            document.getElementById('lightbox-caption-photographer').textContent = trigger.dataset.photographer;
            lightbox.classList.add('open');
            document.body.style.overflow = 'hidden';
        }

        function closeLightbox(event) {
            if (event) {
                event.stopPropagation();
            }
            document.getElementById('lightbox').classList.remove('open');
            document.body.style.overflow = '';
        }

        document.addEventListener('keydown', event => {
            if (event.key === 'Escape') {
                closeLightbox();
            }

            if (event.target.tagName === 'INPUT' || event.target.tagName === 'TEXTAREA') {
                return;
            }

            const tabs = [...document.querySelectorAll('.tab-pill')];
            const currentIndex = tabs.findIndex(tab => tab.classList.contains('active'));

            if (event.key === 'ArrowRight' && currentIndex < tabs.length - 1) {
                tabs[currentIndex + 1].click();
            }

            if (event.key === 'ArrowLeft' && currentIndex > 0) {
                tabs[currentIndex - 1].click();
            }
        });

        document.addEventListener('DOMContentLoaded', () => {
            const slug = decodeURIComponent(window.location.hash.replace('#', ''));
            if (!slug) return;

            const target = document.querySelector(`.tab-pill[data-tab="${slug}"]`);
            if (target) {
                switchTab(slug);
            }
        });

        const GITHUB_REPO = 'krisaruz/daily-photo-coach';
        const REFRESH_PAT = localStorage.getItem('photo_coach_pat') || '';

        async function refreshStyle(style) {
            if (!REFRESH_PAT) {
                const pat = prompt('首次使用需配置 GitHub PAT（仅需 Actions write 权限）：');
                if (!pat) return;
                localStorage.setItem('photo_coach_pat', pat);
                location.reload();
                return;
            }

            const ok = confirm(`确认刷新「${style}」的照片？\n将触发后台重新抓取，约需 2-3 分钟。`);
            if (!ok) return;

            try {
                const response = await fetch(
                    `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/refresh.yml/dispatches`,
                    {
                        method: 'POST',
                        headers: {
                            'Authorization': `token ${REFRESH_PAT}`,
                            'Accept': 'application/vnd.github.v3+json'
                        },
                        body: JSON.stringify({ ref: 'main', inputs: { style } })
                    }
                );

                if (response.status === 204) {
                    alert('已触发刷新。约 2-3 分钟后刷新页面即可看到新照片。');
                } else if (response.status === 401 || response.status === 403) {
                    localStorage.removeItem('photo_coach_pat');
                    alert('PAT 无效或已过期，请重新配置。');
                } else {
                    alert(`触发失败 (HTTP ${response.status})，请检查配置。`);
                }
            } catch (error) {
                alert('网络错误: ' + error.message);
            }
        }
    </script>
</body>
</html>
