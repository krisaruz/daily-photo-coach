<!DOCTYPE html>
<html lang="zh-CN">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>每日摄影教练 · 2025-09-15</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            theme: {
                extend: {
                    fontFamily: { serif: ['"Noto Serif SC"', 'Georgia', 'serif'], sans: ['Inter', 'system-ui', 'sans-serif'] },
                    colors: { ink: '#0f172a', paper: '#faf9f7', muted: '#94a3b8' }
                }
            }
        }
    </script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link href="https://fonts.googleapis.com/css2?family=Noto+Serif+SC:wght@400;600;700;900&family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <style>
        *, *::before, *::after { box-sizing: border-box; }
        body { font-family: 'Inter', system-ui, sans-serif; background: #faf9f7; -webkit-font-smoothing: antialiased; }
        .font-serif { font-family: 'Noto Serif SC', Georgia, serif; }

        /* 隐藏滚动条但保留功能 */
        .scrollbar-hide::-webkit-scrollbar { display: none; }
        .scrollbar-hide { -ms-overflow-style: none; scrollbar-width: none; }

        /* Tab 样式 */
        .tab-pill {
            transition: all 0.25s cubic-bezier(0.4,0,0.2,1);
            position: relative;
        }
        .tab-pill::after {
            content: ''; position: absolute; bottom: -1px; left: 50%; width: 0; height: 2px;
            background: var(--c); transition: all 0.25s ease; transform: translateX(-50%);
        }
        .tab-pill:hover { background: rgba(0,0,0,0.03); }
        .tab-pill.active { color: #0f172a; font-weight: 600; }
        .tab-pill.active::after { width: 100%; }

        /* 面板淡入 */
        .panel { display: none; }
        .panel.active { display: block; animation: slideUp 0.35s cubic-bezier(0.4,0,0.2,1); }
        @keyframes slideUp { from { opacity: 0; transform: translateY(12px); } to { opacity: 1; transform: translateY(0); } }

        /* 照片卡片 */
        .photo-frame {
            position: relative; overflow: hidden; border-radius: 16px;
            background: #e2e0dc; cursor: zoom-in;
        }
        .photo-frame img { transition: transform 0.5s cubic-bezier(0.4,0,0.2,1); }
        .photo-frame:hover img { transform: scale(1.03); }
        .photo-frame .overlay {
            position: absolute; inset: 0;
            background: linear-gradient(to top, rgba(0,0,0,0.5) 0%, transparent 40%);
            opacity: 0; transition: opacity 0.3s;
        }
        .photo-frame:hover .overlay { opacity: 1; }

        /* 灯箱 */
        .lightbox {
            display: none; position: fixed; inset: 0; z-index: 100;
            background: rgba(0,0,0,0.95); cursor: zoom-out;
            justify-content: center; align-items: center;
        }
        .lightbox.open { display: flex; animation: fadeIn 0.25s ease; }
        .lightbox img { max-width: 94vw; max-height: 92vh; object-fit: contain; border-radius: 8px; }
        @keyframes fadeIn { from { opacity: 0 } to { opacity: 1 } }

        /* 分析内容排版 */
        .analysis h2 {
            font-family: 'Noto Serif SC', serif;
            font-size: 1.15rem; font-weight: 700; color: #0f172a;
            margin: 2rem 0 0.6rem; padding-bottom: 0.4rem;
            border-bottom: 1.5px solid #e2e8f0;
        }
        .analysis h2:first-child { margin-top: 0; }
        .analysis h3 { font-size: 1rem; font-weight: 600; color: #1e293b; margin: 1.2rem 0 0.4rem; }
        .analysis p { margin: 0.4rem 0; line-height: 1.85; color: #334155; font-size: 0.935rem; }
        .analysis ul, .analysis ol { margin: 0.4rem 0; padding-left: 1.5rem; }
        .analysis li { margin: 0.2rem 0; line-height: 1.85; color: #334155; font-size: 0.935rem; }
        .analysis strong { color: #0f172a; font-weight: 600; }
        .analysis code {
            background: #f1f5f9; color: #475569; padding: 0.15em 0.45em;
            border-radius: 5px; font-size: 0.88em; font-family: 'SF Mono', 'Fira Code', monospace;
        }
        .analysis hr { border: none; border-top: 1px solid #e2e8f0; margin: 1.5rem 0; }

        /* 展开按钮 */
        .expand-btn {
            transition: all 0.2s;
        }
        .expand-btn:hover { background: #f1f5f9; }
        .expand-btn .chevron { transition: transform 0.3s cubic-bezier(0.4,0,0.2,1); }
        .expand-btn.open .chevron { transform: rotate(180deg); }

        /* EXIF 标签 */
        .exif-tag {
            display: inline-flex; align-items: center; gap: 4px;
            padding: 3px 10px; border-radius: 6px;
            background: #f8fafc; border: 1px solid #e2e8f0;
            font-size: 12px; color: #64748b; font-weight: 500;
            font-variant-numeric: tabular-nums;
        }

        /* 页面背景纹理 */
        body::before {
            content: ''; position: fixed; inset: 0; z-index: -1;
            background-image: radial-gradient(circle at 1px 1px, rgba(0,0,0,0.015) 1px, transparent 0);
            background-size: 32px 32px;
        }
    </style>
</head>
<body class="text-slate-700 min-h-screen">

    <!-- 顶部导航 -->
    <header class="sticky top-0 z-50 bg-[#faf9f7]/85 backdrop-blur-xl border-b border-stone-200/60">
        <div class="max-w-[1200px] mx-auto px-6 h-14 flex items-center justify-between">
            <a href="../index.html" class="group flex items-center gap-2 text-sm text-muted hover:text-ink transition-colors">
                <svg class="w-4 h-4 transition-transform group-hover:-translate-x-0.5" fill="none" stroke="currentColor" stroke-width="2" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M15 19l-7-7 7-7"/></svg>
                历史记录
            </a>
            <div class="text-center">
                <div class="font-serif text-base font-bold tracking-tight text-ink">Daily Photo Coach</div>
            </div>
            <div class="text-xs text-muted font-medium tabular-nums">2025-09-15 · 0 张</div>
        </div>
    </header>

    <!-- 风格 Tab 栏 -->
    <nav class="sticky top-14 z-40 bg-[#faf9f7]/90 backdrop-blur-lg border-b border-stone-200/50">
        <div class="max-w-[1200px] mx-auto px-6">
            <div class="flex gap-0.5 overflow-x-auto scrollbar-hide -mb-px" id="tab-bar">
                
            </div>
        </div>
    </nav>

    <!-- Tab 内容面板 -->
    <main class="max-w-[1200px] mx-auto px-6 py-10">
        
    </main>

    <!-- 底部 -->
    <footer class="py-16 text-center">
        <div class="font-serif text-lg font-bold text-ink/30 tracking-wide">Daily Photo Coach</div>
        <div class="text-xs text-muted mt-2">每日精进摄影之眼</div>
    </footer>

    <!-- 灯箱 -->
    <div class="lightbox" id="lightbox" onclick="closeLightbox()">
        <img id="lb-img" src="">
        <button class="absolute top-6 right-6 text-white/60 hover:text-white transition-colors" onclick="closeLightbox()">
            <svg class="w-8 h-8" fill="none" stroke="currentColor" stroke-width="1.5" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/></svg>
        </button>
    </div>

    <script>
    function switchTab(slug) {
        document.querySelectorAll('.tab-pill').forEach(b => b.classList.remove('active'));
        document.querySelectorAll('.panel').forEach(p => p.classList.remove('active'));
        document.querySelector(`.tab-pill[data-tab="${slug}"]`).classList.add('active');
        document.getElementById(`panel-${slug}`).classList.add('active');
        window.scrollTo({ top: 0, behavior: 'smooth' });
    }

    function toggleAnalysis(btn) {
        const body = btn.nextElementSibling;
        const isOpen = !body.classList.contains('hidden');
        body.classList.toggle('hidden');
        btn.classList.toggle('open', !isOpen);
        btn.querySelector('.label').textContent = isOpen ? '展开拍摄教学分析' : '收起分析';
    }

    function openLightbox(src) {
        document.getElementById('lb-img').src = src;
        document.getElementById('lightbox').classList.add('open');
        document.body.style.overflow = 'hidden';
    }
    function closeLightbox() {
        document.getElementById('lightbox').classList.remove('open');
        document.body.style.overflow = '';
    }

    document.addEventListener('keydown', e => {
        if (e.key === 'Escape') closeLightbox();
        if (e.target.tagName === 'INPUT' || e.target.tagName === 'TEXTAREA') return;
        const tabs = [...document.querySelectorAll('.tab-pill')];
        const idx = tabs.findIndex(t => t.classList.contains('active'));
        if (e.key === 'ArrowRight' && idx < tabs.length - 1) tabs[idx + 1].click();
        if (e.key === 'ArrowLeft' && idx > 0) tabs[idx - 1].click();
    });

    const GITHUB_REPO = 'krisaruz/daily-photo-coach';
    const REFRESH_PAT = localStorage.getItem('photo_coach_pat') || '';

    async function refreshStyle(style) {
        if (!REFRESH_PAT) {
            const pat = prompt('首次使用需配置 GitHub PAT（仅需 Actions write 权限）：');
            if (!pat) return;
            localStorage.setItem('photo_coach_pat', pat);
            location.reload();
            return;
        }
        const ok = confirm(`确认刷新「${style}」的照片？\n将触发后台重新抓取，约需 2-3 分钟。`);
        if (!ok) return;
        try {
            const resp = await fetch(
                `https://api.github.com/repos/${GITHUB_REPO}/actions/workflows/refresh.yml/dispatches`,
                {
                    method: 'POST',
                    headers: {
                        'Authorization': `token ${REFRESH_PAT}`,
                        'Accept': 'application/vnd.github.v3+json'
                    },
                    body: JSON.stringify({ ref: 'main', inputs: { style } })
                }
            );
            if (resp.status === 204) {
                alert('已触发刷新！约 2-3 分钟后刷新页面即可看到新照片。');
            } else if (resp.status === 401 || resp.status === 403) {
                localStorage.removeItem('photo_coach_pat');
                alert('PAT 无效或已过期，请重新配置。');
            } else {
                alert(`触发失败 (HTTP ${resp.status})，请检查配置。`);
            }
        } catch (e) {
            alert('网络错误: ' + e.message);
        }
    }
    </script>
</body>
</html>
