name: Daily Xiaohongshu Pick

on:
  workflow_dispatch:
    inputs:
      backfill_days:
        description: '从目标日期往前补多少天'
        required: false
        default: '1'
        type: string
      date:
        description: '目标/结束日期 (YYYY-MM-DD)，留空为当天'
        required: false
        default: ''
        type: string
      skip_analysis:
        description: '只导入图片，不调用 LLM'
        required: false
        default: false
        type: boolean

jobs:
  xhs-daily:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest output from repo
        run: |
          git fetch origin
          git checkout origin/master -- output/ 2>/dev/null || true

      - name: Add daily Xiaohongshu pick
        env:
          PYTHONPATH: src
          TZ: Asia/Shanghai
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_AUTH: ${{ secrets.LLM_AUTH }}
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_MODEL: ${{ secrets.XHS_LLM_MODEL || 'gpt-5.5' }}
          XHS_LLM_MODEL: ${{ secrets.XHS_LLM_MODEL || 'gpt-5.5' }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          XHS_SEED_URLS: ${{ secrets.XHS_SEED_URLS }}
        run: |
          TARGET_DATE="${{ inputs.date }}"
          if [ -z "$TARGET_DATE" ]; then
            TARGET_DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          fi
          BACKFILL_DAYS="${{ inputs.backfill_days }}"
          if [ -z "$BACKFILL_DAYS" ]; then
            BACKFILL_DAYS="1"
          fi
          ARGS=(
            --date "$TARGET_DATE"
            --backfill-days "$BACKFILL_DAYS"
            --style "小红书｜人像写真"
            --mode note
            --count 1
          )
          if [ "${{ inputs.skip_analysis }}" = "true" ]; then
            ARGS+=(--skip-analysis)
          fi
          python src/xhs_daily.py "${ARGS[@]}"

      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ -f
          git diff --cached --quiet || git commit -m "xhs: daily pick for $(date -u +%Y-%m-%d)"
          git push origin HEAD:master

      - name: Ensure .nojekyll
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
