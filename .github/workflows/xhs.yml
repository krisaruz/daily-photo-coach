name: Import Xiaohongshu Photos

on:
  workflow_dispatch:
    inputs:
      url:
        description: '小红书公开分享链接、笔记链接或主页链接'
        required: true
        type: string
      style:
        description: '归入的栏目名称'
        required: false
        default: '小红书｜人像写真'
        type: string
      source_name:
        description: '来源/博主备注名'
        required: false
        default: ''
        type: string
      limit:
        description: '最多导入多少张图'
        required: false
        default: '6'
        type: string
      model:
        description: '分析模型'
        required: false
        default: 'gpt-5.5'
        type: string
      skip_analysis:
        description: '只导入图片，不调用 LLM'
        required: false
        default: false
        type: boolean

jobs:
  import-xhs:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest output from repo
        run: |
          git fetch origin
          git checkout origin/master -- output/ 2>/dev/null || true

      - name: Import Xiaohongshu photos
        env:
          PYTHONPATH: src
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_AUTH: ${{ secrets.LLM_AUTH }}
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_MODEL: ${{ inputs.model }}
          XHS_LLM_MODEL: ${{ inputs.model }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
        run: |
          ARGS=(
            --url "${{ inputs.url }}"
            --style "${{ inputs.style }}"
            --source-name "${{ inputs.source_name }}"
            --limit "${{ inputs.limit }}"
            --model "${{ inputs.model }}"
          )
          if [ "${{ inputs.skip_analysis }}" = "true" ]; then
            ARGS+=(--skip-analysis)
          fi
          python src/xhs_import.py "${ARGS[@]}"

      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ -f
          git diff --cached --quiet || git commit -m "xhs: import photos for $(date -u +%Y-%m-%d)"
          git push origin HEAD:master

      - name: Ensure .nojekyll
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
