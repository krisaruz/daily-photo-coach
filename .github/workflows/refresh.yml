name: Refresh Style

on:
  workflow_dispatch:
    inputs:
      style:
        description: '要刷新的风格关键词（如：人像、街头、风光）'
        required: true
        type: string

jobs:
  refresh:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest output from repo
        run: |
          git fetch origin
          git checkout origin/master -- output/ 2>/dev/null || true

      - name: Refresh specific style (skip LLM)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          PYTHONPATH: src
        run: python src/refresh.py --style "${{ inputs.style }}" --skip-analysis

      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ -f
          git diff --cached --quiet || git commit -m "refresh: ${{ inputs.style }} photos for $(date -u +%Y-%m-%d)"
          git push origin HEAD:master

      - name: Ensure .nojekyll
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
