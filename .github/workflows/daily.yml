name: Daily Photo Coach

on:
  schedule:
    - cron: '0 18 * * *'  # UTC 18:00 = 北京 02:00
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest output from repo
        run: |
          git fetch origin
          git checkout origin/master -- output/ 2>/dev/null || true

      - name: Fetch and Analyze photos (Runs completely on GitHub Actions)
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_AUTH: ${{ secrets.LLM_AUTH }}
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL }}
          PYTHONPATH: src
        run: python src/main.py

      - name: Commit output to repo
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ -f
          git diff --cached --quiet || git commit -m "daily: fetch photos for $(date -u +%Y-%m-%d)"
          git push origin HEAD:master

      - name: Ensure .nojekyll
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@v4
