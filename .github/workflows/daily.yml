name: Daily Photo Coach

on:
  schedule:
    - cron: '20 1-14 * * *'  # 北京时间 09:20-22:20，每小时一次；真正执行时刻由 analysis_schedule 随机抽取
  workflow_dispatch:

jobs:
  generate:
    runs-on: ubuntu-latest
    permissions:
      contents: write
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Pull latest output from repo
        run: |
          git fetch origin
          git checkout origin/master -- output/ 2>/dev/null || true

      - name: Decide whether to run
        id: gate
        env:
          PYTHONPATH: src
          FORCE_RUN: ${{ github.event_name == 'workflow_dispatch' && 'true' || 'false' }}
        run: python src/analysis_schedule.py --output-dir output

      - name: Debug LLM_AUTH
        if: steps.gate.outputs.should_run == 'true'
        env:
          LLM_AUTH: ${{ secrets.LLM_AUTH }}
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'azure/gpt-5.5' }}
          LLM_GATEWAY_UID: ${{ secrets.LLM_GATEWAY_UID }}
          LLM_GATEWAY_PRODUCT: ${{ secrets.LLM_GATEWAY_PRODUCT }}
          LLM_GATEWAY_INTENTION: ${{ secrets.LLM_GATEWAY_INTENTION }}
        run: |
          python -c "
import os, requests
a = os.environ.get('LLM_AUTH','')
url = os.environ.get('LLM_URL','')
model = os.environ.get('LLM_MODEL','')
uid = os.environ.get('LLM_GATEWAY_UID','')
prod = os.environ.get('LLM_GATEWAY_PRODUCT','')
intent = os.environ.get('LLM_GATEWAY_INTENTION','')
print('LLM_AUTH len:', len(a))
print('LLM_AUTH starts_with_bearer:', a.lower().startswith('bearer '))
auth = a if a.lower().startswith(('bearer ','token ')) else f'Bearer {a}'
print('auth header len:', len(auth))
headers = {
  'Authorization': auth,
  'AI-Gateway-Uid': uid,
  'AI-Gateway-Product-Name': prod,
  'AI-Gateway-Intention-Code': intent,
  'Content-Type': 'application/json',
}
payload = {'model': model, 'stream': False, 'messages':[{'role':'user','content':'PONG'}]}
try:
    r = requests.post(url, headers=headers, json=payload, timeout=30)
    print('HTTP', r.status_code)
    print('Body head:', r.text[:300])
except Exception as e:
    print('ERR:', e)
"


      - name: Fetch and analyze photos
        if: steps.gate.outputs.should_run == 'true'
        env:
          UNSPLASH_ACCESS_KEY: ${{ secrets.UNSPLASH_ACCESS_KEY }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          LLM_AUTH: ${{ secrets.LLM_AUTH }}
          LLM_URL: ${{ secrets.LLM_URL }}
          LLM_MODEL: ${{ secrets.LLM_MODEL || 'azure/gpt-5.5' }}
          XHS_LLM_MODEL: ${{ secrets.XHS_LLM_MODEL || 'gpt-5.5' }}
          XHS_COOKIE: ${{ secrets.XHS_COOKIE }}
          XHS_SEED_URLS: ${{ secrets.XHS_SEED_URLS }}
          PYTHONPATH: src
          TZ: Asia/Shanghai
        run: |
          TARGET_DATE="$(TZ=Asia/Shanghai date +%Y-%m-%d)"
          echo "target_date=$TARGET_DATE"
          if [ -f "output/$TARGET_DATE/photos.json" ]; then
            python src/main.py --date "$TARGET_DATE" --skip-fetch
          else
            python src/main.py --date "$TARGET_DATE"
          fi
          python src/xhs_daily.py --date "$TARGET_DATE" --style "小红书｜人像写真" --mode note --count 1

      - name: Commit output to repo
        if: steps.gate.outputs.should_run == 'true'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add output/ -f
          git diff --cached --quiet || git commit -m "daily: fetch photos for $(TZ=Asia/Shanghai date +%Y-%m-%d)"
          git push origin HEAD:master

      - name: Ensure .nojekyll
        if: steps.gate.outputs.should_run == 'true'
        run: touch output/.nojekyll

      - name: Upload Pages artifact
        if: steps.gate.outputs.should_run == 'true'
        uses: actions/upload-pages-artifact@v3
        with:
          path: output

      - name: Deploy to GitHub Pages
        if: steps.gate.outputs.should_run == 'true'
        id: deployment
        uses: actions/deploy-pages@v4
